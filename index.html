<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>HKSBC 羽毛球活動編排</title>
<!-- PWA：加入主畫面後變成全螢幕「App」，並支援離線快取（見 service-worker.js）。
     呢啲標籤喺 Claude Artifact 入面會被忽略，唔影響網上版；只有喺自行架設嘅網站
     （例如 GitHub Pages）先會生效。 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8865F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HKSBC">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #FFF3E9; --surface: #FFFDFB; --primary: #E8865F; --text: #3A3A3A; --muted: #8F7B6E; --danger: #D9564A; --border: #F0DCC9;
  --gA: #E8865F; --gB: #3F8F8B; --gC: #4E9F5E; --male: #3B7DD8; --female: #E85D75; --ok: #4E9F5E;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #2B2320; --surface: #362C27; --primary: #F2A47D; --text: #FBEEE5; --muted: #C2A392; --danger: #E88F84; --border: #4A3B32;
    --gA: #F2A47D; --gB: #6CC0BB; --gC: #7CC38B; --male: #6FA3EE; --female: #F08A9D; --ok: #7CC38B;
  }
}
/* 管理員 MODE：全個畫面底色轉做深淺藍色系（唔會影響上面 A/B/C/男女等固定顏色），
   等使用者一望就知而家係咪處於管理員模式，唔會同平時（只留喺球場頁）嘅畫面搞亂。 */
body.admin-on {
  --bg: #E3EEFC; --surface: #F3F8FF; --border: #BBD4F5; --primary: #2E63C9;
}
@media (prefers-color-scheme: dark) {
  body.admin-on {
    --bg: #16233A; --surface: #1F3352; --border: #35507E; --primary: #7FAEFA;
  }
}
.admin-banner { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 800; font-size: 13px;
  letter-spacing: .5px; color: #fff; background: var(--primary); border-radius: 12px; padding: 6px 10px; margin: 0 0 10px; }
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
.app { max-width: 1000px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; }
.header { position: sticky; top: 0; background: var(--bg); padding: 14px 16px 0; z-index: 5; }
.title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.title { font-weight: 800; font-size: 20px; color: var(--primary); }
.badge-top { font-size: 12px; font-weight: 700; color: var(--bg); background: var(--text); padding: 4px 12px; border-radius: 999px; }
.tabs { display: flex; gap: 4px; background: var(--border); padding: 4px; border-radius: 22px; }
.tab { flex: 1; border: none; background: transparent; padding: 9px 0; font: inherit; font-size: 14px; font-weight: 700; color: var(--muted); border-radius: 16px; cursor: pointer; }
.tab.active { background: var(--surface); color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.view { padding: 16px; }
.hint { color: var(--muted); font-size: 14px; text-align: center; padding: 18px 8px; line-height: 1.6; }

.btn { font: inherit; font-weight: 700; font-size: 14px; border: none; border-radius: 14px; padding: 10px 16px; cursor: pointer; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-danger { background: var(--danger); color: #fff; }
.ws-toggle { color: #fff; font-weight: 700; border: none; }
.ws-toggle.ws-off { background: var(--danger); }
.ws-toggle.ws-on { background: var(--ok); }
.ci-toggle { color: #fff; font-weight: 700; border: none; }
.ci-toggle.ci-out { background: var(--ok); }
.ci-toggle.ci-in { background: var(--danger); }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 12px; }

.cols { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 860px) { .cols { grid-template-columns: 1.5fr 1fr; align-items: start; } }
.courts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (max-width: 640px) { .courts { grid-template-columns: 1fr; } }
.queue-flow { display: flex; flex-wrap: wrap; gap: 10px; }
.panel-title { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 15px; margin: 0 0 10px; }
.court { background: var(--surface); border-radius: 20px; padding: 14px; border-left: 5px solid var(--primary); }
.court.tA { border-left-color: var(--gA); }
.court.tB { border-left-color: var(--gB); }
.court.tC { border-left-color: var(--gC); }
.court.tF { border-left-color: var(--female); }
.court.idle { opacity: .85; }
.court-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 6px; }
.court-label { font-weight: 800; font-size: 14px; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--bg); color: var(--primary); }
.tag.ws { background: var(--primary); color: #fff; }
.tag.tA { background: var(--gA); color: #fff; } .tag.tB { background: var(--gB); color: #fff; } .tag.tC { background: var(--gC); color: #fff; } .tag.tF { background: var(--female); color: #fff; }
.team { width: 100%; text-align: left; background: var(--bg); border: 2px solid var(--border); border-radius: 14px; padding: 10px 12px; color: var(--text); font: inherit; display: block; }
.team-row-flex { display: flex; align-items: center; gap: 8px; }
.team-info { flex: 1; min-width: 0; }
.win-icon-btn { flex: none; width: 42px; height: 42px; border-radius: 12px; border: none; background: var(--primary); color: #fff; font-size: 19px; cursor: pointer; }
.vs { text-align: center; font-size: 11px; font-weight: 800; color: var(--muted); padding: 4px 0; }
.court-actions { display: flex; justify-content: space-between; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.next-up { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.pc { display: inline-flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 600; margin: 2px 10px 2px 0; }
.pc small { font-size: 11px; color: var(--muted); font-weight: 600; }
.pc.gM .nm { border-bottom: 2px solid var(--male); }
.pc.gF .nm { border-bottom: 2px solid var(--female); }
.pc-btn { border: 1px dashed var(--muted); background: var(--surface); color: var(--text); border-radius: 10px; padding: 3px 8px; margin: 3px 6px 3px 0; cursor: pointer; font: inherit; }
.pc-btn .pc { margin: 0; }
.gr { font-style: normal; font-size: 10px; font-weight: 800; color: #fff; border-radius: 6px; padding: 1px 5px; }
.gr.A { background: var(--gA); } .gr.B { background: var(--gB); } .gr.C { background: var(--gC); } .gr.F { background: var(--female); }
.mx { font-style: normal; font-size: 10px; font-weight: 800; border-radius: 6px; padding: 1px 5px; border: 1px solid var(--muted); color: var(--muted); }

.card { background: var(--surface); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
.q-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 12px; flex: 1 1 250px; }
.q-no { width: 22px; text-align: center; font-weight: 800; color: var(--muted); font-size: 13px; }
.q-main { flex: 1; min-width: 0; }
.q-sub { font-size: 11px; color: var(--muted); }
.icon-btn { border: 1px solid var(--border); background: var(--bg); color: var(--muted); border-radius: 10px; width: 28px; height: 28px; cursor: pointer; font-size: 13px; }
.icon-btn:hover { color: var(--primary); }
.status { font-size: 12px; padding: 8px 12px; border-radius: 12px; background: var(--bg); color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
.status.on { background: color-mix(in srgb, var(--ok) 16%, var(--bg)); color: var(--ok); font-weight: 700; }
.status.info { background: var(--surface); color: var(--text); }

.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 32px; height: 32px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); font-size: 18px; font-weight: 700; cursor: pointer; color: var(--primary); }
.stepper b { min-width: 20px; text-align: center; font-size: 17px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; font-size: 14px; font-weight: 600; }
.row small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
.card h3 { margin: 0 0 6px; font-size: 14px; color: var(--primary); }
input[type=text], input[type=number], input[type=date], input[type=password], select, textarea { font: inherit; font-size: 14px; border: 1px solid var(--border); border-radius: 12px; padding: 9px 11px; background: var(--surface); color: var(--text); }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.add-row input[type=text] { flex: 1; min-width: 120px; }
.chk { font-size: 13px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
.type-select { width: 100%; margin: 8px 0 4px; }

.m-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--surface); border-radius: 14px; padding: 8px 12px; margin-bottom: 6px; }
.m-row.off { opacity: .6; }
.m-name { flex: 1; min-width: 90px; font-weight: 700; font-size: 15px; }
.seg { display: inline-flex; gap: 3px; }
.seg button { min-width: 30px; height: 28px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); font-weight: 800; font-size: 12px; cursor: pointer; }
.seg .aM { background: var(--male); color: #fff; border-color: var(--male); }
.seg .aF { background: var(--female); color: #fff; border-color: var(--female); }
.seg .aA { background: var(--gA); color: #fff; border-color: var(--gA); }
.seg .aB { background: var(--gB); color: #fff; border-color: var(--gB); }
.seg .aC { background: var(--gC); color: #fff; border-color: var(--gC); }
.seg .aX { background: var(--ok); color: #fff; border-color: var(--ok); }
.wl { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.wl input { width: 52px; padding: 5px 6px; text-align: center; }
.rate { min-width: 42px; text-align: right; font-weight: 800; color: var(--primary); font-size: 14px; }
.bridge { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; background: var(--border); color: var(--text); }
.x-btn { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 17px; padding: 2px 6px; }
.x-btn:hover { color: var(--danger); }
.sec-title { font-weight: 800; font-size: 14px; margin: 16px 0 8px; display: flex; gap: 8px; align-items: center; }
.log-head { font-weight: 800; font-size: 13px; color: var(--primary); margin: 16px 0 6px; }
.log-row { background: var(--surface); border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; font-size: 14px; }
.log-meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
.log-team.w { font-weight: 800; color: var(--ok); }
.log-team.w::before { content: "勝 "; font-size: 11px; }
.log-team.l { color: var(--muted); }
.note { font-size: 12px; color: var(--muted); text-align: center; padding: 10px 16px; line-height: 1.6; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; flex: 1; min-width: 140px; }
.field input, .field select { width: 100%; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
@media (min-width: 700px) { .modal-backdrop { align-items: center; } }
.modal { background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px; width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; }
@media (min-width: 700px) { .modal { border-radius: 20px; } }
.modal h4 { margin: 0 0 8px; font-size: 15px; }
.modal .sub { font-size: 12px; color: var(--muted); margin: 14px 0 6px; font-weight: 700; }
.modal.dialog { max-width: 380px; z-index: 30; }
.modal.dialog p { white-space: pre-line; line-height: 1.6; font-size: 14px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.dialog-input { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; margin-top: 6px; }
.dialog-backdrop { z-index: 30; }
.pick { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; font: inherit; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; margin-bottom: 6px; cursor: pointer; }
.pick .q-sub { white-space: nowrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 46px; height: 46px; border-radius: 12px; background: #fff; object-fit: contain; padding: 2px; flex: none; }
.brand-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.brand-name { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status.flex { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.status.warn { background: color-mix(in srgb, var(--danger) 14%, var(--bg)); color: var(--danger); font-weight: 700; }
.m-name-input { flex: 1; min-width: 80px; font-weight: 700; font-size: 15px; padding: 6px 9px; }
.foot-logo { display: block; margin: 6px auto 8px; width: 64px; height: 64px; border-radius: 14px; background: #fff; padding: 3px; }
.splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; background: var(--bg); }
.splash img { width: 96px; height: 96px; border-radius: 22px; background: #fff; padding: 4px; margin-bottom: 18px; }
.splash h1 { font-size: 21px; color: var(--primary); margin: 0 0 4px; }
.splash .sub { font-size: 13px; color: var(--muted); margin: 0 0 18px; }
.splash .ver { font-size: 13px; font-weight: 700; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 16px; margin-bottom: 26px; }
</style>
</head>

const t = (key, ...args) => {
  const s = (I18N[state.settings.lang || 'zh'] || I18N.zh)[key];
  return typeof s === 'function' ? s(...args) : (s ?? key);
};
function toggleLang() { state.settings.lang = state.settings.lang === 'en' ? 'zh' : 'en'; save(); render(); }

/* ---------- 資料結構 ---------- */
function newCourt() { return { status: 'idle', teams: null, stay: 0, num: 0, manualType: null, closing: false, startedAt: null, fSub: 0, fWinPair: null, fQuad: null, fPairA: null, fPairB: null, fFourIds: null, fFourIdx: 0, isWomenCourt: false }; }
function freshSession(n, venue) {
  return { date: today(), venue: venue || '', maxAttend: 0, ws: false, started: false, attendConfirmed: false,
           guests: [], present: [], checkedIn: [], left: [], queue: [], courts: Array.from({ length: n }, newCourt),
           played: {}, wait: {}, pairs: {}, mates: {}, counter: 0, night: Date.now(), maleStreak: 0, rev: 0 };
}
const FIXED_ADMIN_PASSWORD = 'sar59red';
const SESSION_MINUTES = 120;    // 活動總時長固定兩小時，唔使學習
// 學習「平均每場耗時」：攞最近有記錄嘅場次（durationMs）計平均值，樣本太少就當未學到，交返後備參考數字。
function learnedMatchMinutes() {
  const durs = state.log.filter(l => l.durationMs != null && l.durationMs > 0 && l.durationMs < 2 * 3600 * 1000)
    .slice(0, 300).map(l => l.durationMs);
  if (durs.length < 8) return null;
  return durs.reduce((a, b) => a + b, 0) / durs.length / 60000;
}
// 未學夠數據之前嘅後備基準：跟返你哋實際慣例（2 個場 14 人、4 個場 26 人）做兩點線性推算，
// 其他場數（不足 2 場、多於 4 場）都用同一條斜率外推。
function practiceBaseAttend(courts) {
  return Math.max(0, Math.round(14 + (courts - 2) * 6));
}
// 容量估算：有足夠學習數據就用「平均每場耗時 + 固定 120 分鐘活動時長」計；未夠就用返practice 基準（+2 彈性名額）。
function capacityEstimate() {
  const courts = state.session.courts.length;
  const mm = learnedMatchMinutes();
  if (mm != null) {
    const totalSlots = courts * (SESSION_MINUTES / mm) * 4;   // 一晚總共可以容納嘅「人次」
    return { learned: true, matchMinutes: mm, totalSlots, suggested: Math.max(0, Math.round(totalSlots / 6)) };
    // 註：/6 對應你哋慣例入面隱含嘅「每人大約打 6 局」呢個目標，同 26+2／14+2 個比例大致脗合。
  }
  return { learned: false, matchMinutes: null, totalSlots: null, suggested: practiceBaseAttend(courts) + 2 };
}
function freshSettings() { return { courts: 4, wsMax: 2, venues: ['Sutton Grammar School', 'Westcroft Leisure Centre'], adminPassword: FIXED_ADMIN_PASSWORD, lang: 'zh',
  promoteMinGames: 20, promoteWinRate: 65, relegateWinRate: 35, forceWomenEveryN: 3, rev: 0 }; }
function freshState() { const st = freshSettings(); return { members: [], settings: st, log: [], activities: [], session: freshSession(st.courts, st.venues[0] || '') }; }

function normMember(m) {
  const gender = m.gender === 'F' ? 'F' : 'M';
  // 女仕自動適合混雙，唔使人手設定（亦唔可以關閉）。
  return { id: m.id || uid(), name: String(m.name || '?'), gender, grade: (m.grade === 'A' || m.grade === 'C') ? m.grade : 'B',
           mixed: gender === 'F' ? true : !!m.mixed, wins: Math.max(0, +m.wins || 0), losses: Math.max(0, +m.losses || 0) };
}
function normalize(raw) {
  const d = freshState();
  const rs = raw.settings || {};
  const s = { members: (raw.members || []).map(normMember) };
  s.settings = { ...d.settings, ...rs };
  delete s.settings.ws; delete s.settings.wsMin;
  delete s.settings.bridgeA; delete s.settings.bridgeB; // 舊版「跨組」設定已經取消，唔再使用
  s.settings.venues = (Array.isArray(rs.venues) && rs.venues.length) ? rs.venues.map(String) : d.settings.venues.slice();
  s.settings.courts = Math.max(1, Math.min(20, +s.settings.courts || 4));
  s.settings.adminPassword = FIXED_ADMIN_PASSWORD; // 密碼已改為系統固定，唔再喺設定頁俾人改
  s.settings.lang = rs.lang === 'en' ? 'en' : 'zh';
  s.settings.promoteMinGames = Math.max(1, Math.min(100, +s.settings.promoteMinGames || 20));
  s.settings.promoteWinRate = Math.max(1, Math.min(100, +s.settings.promoteWinRate || 65));
  s.settings.relegateWinRate = Math.max(0, Math.min(100, +s.settings.relegateWinRate || 35));
  { const fw = rs.forceWomenEveryN; s.settings.forceWomenEveryN = (fw === 0 || fw === '0') ? 0 : Math.max(1, Math.min(20, +fw || 3)); }
  s.settings.rev = Math.max(0, parseInt(rs.rev, 10) || 0);
  s.log = Array.isArray(raw.log) ? raw.log.slice(0, 1000) : [];
  s.activities = Array.isArray(raw.activities) ? raw.activities.slice(0, 100) : [];
  const se = raw.session || {};
  const guests = (Array.isArray(se.guests) ? se.guests : []).map(g => ({ ...normMember(g), guest: true }));
  const ids = new Set([...s.members.map(m => m.id), ...guests.map(g => g.id)]);

// 改為固定嘅夾組規則（見 groupFits）：A 永遠淨係同 A 對打；B 係 A 同 C 之間嘅橋樑，
// A 或 C 人數唔夠 4 人自己開場嗰陣，就夾 2 位 B 落去（一隊入面一位 A/C 配一位 B）；
// B 自己人數夠都可以自己開場（B 對 B）。
function buildInfo() {
  const present = state.session.present.map(M).filter(Boolean);
  const cmp = (a, b) => sm(b) - sm(a) || games(b) - games(a) || a.name.localeCompare(b.name);
  const A = present.filter(m => m.gender === 'M' && m.grade === 'A').sort(cmp);
  const B = present.filter(m => m.gender === 'M' && m.grade === 'B').sort(cmp);
  const C = present.filter(m => m.gender === 'M' && m.grade === 'C').sort(cmp);
  const W = present.filter(m => m.gender === 'F').sort(cmp);
  const idx = {}; let pos = 0;
  [A, B, C, W].forEach(list => {
    let prev = null, pi = 0;
    list.forEach(m => {
      const r = sm(m);
      if (prev === null || Math.abs(r - prev) > 1e-9) { pi = pos; prev = r; }

  if (!c || c.status !== 'idle') return false;
  let types = courtTypes();
  if (types[i] === 'F') {
    c.isWomenCourt = true;   // 呢個場一經編排做女仕場，身份就固定落嚟，唔會因為之後人數/場數變化而中途「唔見咗」
    if (fillFemaleCourt(i)) return true;
    // 填唔到（例如夾唔出合規組合）：如果即時女仕人數已經跌落 4 人以下，先釋放呢個場返做普通場，
    // 避免場地因為一個已經冇資格再保留嘅女仕身份而永久卡住；如果女仕仲夠 4 人，就保留身份、
    // 等下次輪候名單有變再試（唔搶佢去做普通場，避免女仕場「被消失」）。
    const fNow = s.checkedIn.map(M).filter(m => m && m.gender === 'F').length;
    if (fNow >= 4) return false;
    c.isWomenCourt = false;
    types = courtTypes();
  }
  const pt = pickType(i, types);
  const forceN = +state.settings.forceWomenEveryN || 0;
  // 全場輪替：連續 N 局冇女性之後，優先搵一組有女性嘅組合；搵唔到就照舊正常編排（唔會令場地閒置等女性）。
  // A 場永遠唔會夾女仕（A 組唔同女仕混雙），所以 pt 係 'A' 嗰陣完全唔使嘗試呢個強制安排。
  let p = (forceN > 0 && pt !== 'A' && (s.maleStreak || 0) >= forceN) ? pickGroup([], pt, { requireFemale: true }) : null;
  if (!p) p = pickGroup([], pt);
  if (!p) p = pickGroupMaleFallback([], pt);
  if (!p) return false;
  s.queue = s.queue.filter(id => !p.ids.includes(id));
  c.status = 'playing'; c.teams = splitTeams(p.ids, p.info); c.stay = 0; c.num = ++s.counter; c.startedAt = Date.now();
  markPlaced(p.ids);
  noteGenderStreak(p.ids);
  return true;
}
function fillIdle(first) {
  const types = courtTypes(), order = [];
  if (first != null) order.push(first);
  const rest = state.session.courts.map((_, i) => i).filter(i => i !== first);
  rest.sort((a, b) => (types[a] === 'G') - (types[b] === 'G'));       // 保留場優先
  order.push(...rest);
  order.forEach(i => fillCourt(i));
}
function recordResult(i, w) {
  const s = state.session, c = s.courts[i];
  if (!c || c.status !== 'playing') return;
  const win = c.teams[w], lose = c.teams[1 - w];
  win.forEach(id => { const m = M(id); if (m) m.wins++; s.played[id] = (s.played[id] || 0) + 1; });
  lose.forEach(id => { const m = M(id); if (m) m.losses++; s.played[id] = (s.played[id] || 0) + 1; });
  const all = c.teams.flat();
  for (let a = 0; a < 4; a++) for (let b = a + 1; b < 4; b++) { const k = pairKey(all[a], all[b]); s.pairs[k] = (s.pairs[k] || 0) + 1; }
  c.teams.forEach(t => { const k = pairKey(t[0], t[1]); s.mates[k] = (s.mates[k] || 0) + 1; });
  s.queue.forEach(id => { s.wait[id] = (s.wait[id] || 0) + 1; });     // 輪空局數
  // 記低呢一局由編排完（c.startedAt）到完結（而家）用咗幾耐，用嚟學習「平均每場耗時」，
  // 過濾明顯唔合理嘅數值（例如頁面開住成晚冇按完場，唔計落平均數）。
  const durationMs = (c.startedAt && Date.now() > c.startedAt) ? (Date.now() - c.startedAt) : null;
  state.log.unshift({
    id: uid(), time: Date.now(), night: s.night, date: s.date, venue: s.venue, court: i + 1, num: c.num,
    teams: [[...c.teams[0]], [...c.teams[1]]],
    names: c.teams.map(t => t.map(id => (M(id) || {}).name || '?')), winner: w, durationMs
  });
  state.log = state.log.slice(0, 1000);

  // 女仕專場自己有固定嘅運作方式（女雙→混1→混2→…），唔適用 Winner Stay；
  // 呢度先推進局種：女雙啱啱完場就記低邊方贏（比之後嘅混1 用），混1／混2 完場就推進去下一個局種。
  const types = courtTypes();
  if (types[i] === 'F') {
    const sub = c.fSub || 0;
    if (sub === 0) {
      c.fWinPair = [...win];
      c.fQuad = [...win, ...lose].filter(id => M(id) && M(id).gender === 'F');
      c.fPairA = [...c.teams[0]]; c.fPairB = [...c.teams[1]];   // 隊一／隊二（唔理輸贏），供啱啱好 4 位女仕嗰個情況用
      c.fSub = 1;
    }
    else if (sub === 1) { c.fSub = 2; }
    else if (sub === 2) {
      // 女仕 4 位或以上但少於 6 位時：一個循環（女雙／混1／混2）完咗，插一場男雙先至再開始第二個循環；
      // 女仕夠 6 位或以上就唔使插，直接返去女雙開始下一個循環。
      const totalWomen = s.checkedIn.filter(id => { const m = M(id); return m && m.gender === 'F'; }).length;
      c.fSub = (totalWomen >= 4 && totalWomen < 6) ? 3 : 0;
    }
    else { c.fSub = 0; }
  }
  // 負方先排隊（納入候選池），如已人手開啟 Winner Stay，A 組勝方留場（連續留場局數不能多於設定上限）；
  // 若勝方冇留場，重新排隊時勝方會排先於負方，令佢哋更快再上場
  s.queue.push(...lose);
  let stayed = false;
  const st = state.settings;
  if (types[i] !== 'F' && !c.closing && s.ws && win.every(id => M(id) && M(id).grade === 'A') && (!+st.wsMax || (c.stay + 1) < +st.wsMax)) {
    const pt = pickType(i, types);
    const p = pickGroup(win, pt);
    if (p) {
      const ch = p.ids.filter(id => !win.includes(id));
      s.queue = s.queue.filter(id => !ch.includes(id));
      c.teams = [[...win], ch]; c.stay++; c.num = ++s.counter; c.startedAt = Date.now(); stayed = true;
      markPlaced(ch);
      noteGenderStreak(p.ids);
    }
  }
  if (!stayed) {
    s.queue = s.queue.filter(id => !lose.includes(id));
    s.queue.push(...win, ...lose);
    if (c.closing) { c.status = 'closed'; c.teams = null; c.stay = 0; c.num = 0; c.closing = false; }
    else { c.status = 'idle'; c.teams = null; c.stay = 0; c.num = 0; fillIdle(i); }
  } else fillIdle(null);
  delete ui.edit[i];
  save(); render();
}
function toggleWS() { state.session.ws = !state.session.ws; save(); render(); }
function cancelCourt(i) {
  const s = state.session, c = s.courts[i];
  if (!c || c.status !== 'playing') return;
  s.queue = [...c.teams.flat(), ...s.queue];

}
// 完結此場：空場即時完結；進行中的場地會標記「本局後停用」，該局完結後才真正停用，
// 且該局完結後不會再編排新對戰（即使 Winner Stay 已開啟也不會留場）。
function closeCourt(i) {

  c.status = 'closed'; save(); render();
}

}

  c.fSub = 0; c.fWinPair = null; c.fQuad = null; c.fPairA = null; c.fPairB = null; c.fFourIds = null; c.fFourIdx = 0; c.isWomenCourt = false;

}
function setCourts(n) {

  const s = state.session;

    if (s.courts.slice(n).some(c => c.status === 'playing')) { showAlert(t('reduceCourtsBlocked')); return; }
    s.courts = s.courts.slice(0, n);

  save(); render();
}

/* ---------- 手動更改對戰名單 ---------- */

function replaceWith(ci, oldId, newId) {

/* ---------- 出席 / 確認 / 開始活動 / 離開活動 ---------- */
// 出席名單／日期／場地／人數上限一有改動，就當「未確認」，等「確認出席名單」掣重新彈返出嚟
// （唔理活動係咪已經開始 —— 中途改咗名單都要俾管理員清楚見到掣，再撳一次先算數）。
function touchAttend() { state.session.attendConfirmed = false; }
function setDate(v) { if (v) { state.session.date = v; touchAttend(); save(); render(); } }
function setVenue(v) { state.session.venue = (v || '').trim(); touchAttend(); save(); render(); }

const atMax = () => { const mx = +state.session.maxAttend; return mx > 0 && state.session.present.length >= mx; };
// 確認出席：揀好出席人員後撳一下就直接確認＋轉去「活動」分頁。第一次確認會即時開始活動；
// 活動已經開始之後，如果中途改咗出席名單（觸發咗 touchAttend），掣會重新出現，再撳一次
// 一樣會確認＋轉返去活動分頁，等管理員可以清楚見到＋落實每次改動。
function confirmAttend() {
  if (!state.session.present.length) { showAlert(t('confirmAttendNeedOne')); return; }
  const s = state.session;
  s.attendConfirmed = true; s.started = true; tab = 'courts';
  save(); render();
}
function startActivity() {
  const s = state.session;
  if (!s.attendConfirmed) { showAlert(t('startNeedConfirm')); return; }
  if (s.started) return;
  s.started = true; save(); tab = 'courts'; render();
}
function setPresent(id, on) {
  const s = state.session;
  if (on) {
    if (!s.present.includes(id)) {
      if (atMax()) { showAlert(t('maxAttendReached', s.maxAttend)); return render(); }
      s.present.push(id);
    }
    s.left = s.left.filter(x => x !== id);
    touchAttend(); save(); render();
  } else {
    if (playing().has(id)) { showConfirm(t('leavingWhilePlayingConfirm'), () => leaveActivity(id)); return render(); }
    leaveActivity(id);
  }
}
// Check-in：出席（present）唔會自動入排序隊，要按 Check-in 先會按 Check-in 次序入隊。
function checkIn(id) {
  const s = state.session;
  if (!s.present.includes(id) || s.checkedIn.includes(id)) { render(); return; }
  s.checkedIn.push(id); s.queue.push(id); s.wait[id] = 0;
  save(); render();
}
function checkOut(id) {
  const s = state.session;
  if (playing().has(id)) { showAlert(t('checkOutBlockedAlert')); return; }
  s.checkedIn = s.checkedIn.filter(x => x !== id); s.queue = s.queue.filter(x => x !== id);
  save(); render();
}
function toggleCheckIn(id, on) { if (on) checkIn(id); else checkOut(id); }
function leaveActivity(id) {
  const s = state.session;
  const ci = s.courts.findIndex(c => c.status === 'playing' && c.teams.flat().includes(id));
  s.present = s.present.filter(x => x !== id); s.queue = s.queue.filter(x => x !== id); s.checkedIn = s.checkedIn.filter(x => x !== id);
  if ((s.played[id] || 0) > 0 && !s.left.includes(id)) s.left.push(id);
  if (ci >= 0) {
    const types = courtTypes(), pt = pickType(ci, types), info = buildInfo(), c = s.courts[ci];
    const rest = c.teams.flat().filter(x => x !== id);
    const rep = s.queue.find(q => eligible(q, pt, info) && groupFits([...rest, q], pt, info));
    if (rep) {
      c.teams = c.teams.map(t => t.map(x => x === id ? rep : x));
      s.queue = s.queue.filter(x => x !== rep); s.wait[rep] = 0;
    } else {
      s.queue = [...rest, ...s.queue]; s.courts[ci] = { ...newCourt(), manualType: c.manualType || null }; fillCourt(ci);
    }
  }
  ui.swap = null; touchAttend(); save(); render();
}
// 按組別「全出席」：group 係 'A'/'B'/'C'（男仕分級）或 'F'（女子組），淨係將嗰個組別嘅會員設做出席，
// 唔會郁其他組別已有嘅出席狀態（例如已按過「全A」，之後再按「全女」，A 組唔會被清走）。

  const s = state.session; let skipped = 0;

  state.members.filter(inGroup).forEach(m => {

  };

  else finish();
}
function doBulk() {
  const txt = document.getElementById('bulkText').value;
  let n = 0, skipped = 0;
  txt.split(/\n/).forEach(rawLine => {
    const line = rawLine.trim();
    if (!line) return;
    // 姓名可以有空格（例如 "Chris Kwan"）：如果一行入面有逗號，就用逗號分隔欄位（姓名, 性別, 組別, 混雙），
    // 姓名本身嘅空格會保留；如果冇逗號，先當係舊格式（純用空格分隔，姓名唔可以有空格）。
    const parts = (/[,，]/.test(line) ? line.split(/[,，]/) : line.split(/\s+/)).map(s => s.trim()).filter((s, i) => i === 0 || s.length);
    const name = parts[0];
    if (!name) return;
    let g = 'M', gr = 'B', mx = false;
    parts.slice(1).forEach(x => {
      if (/^(m|男)$/i.test(x)) g = 'M'; else if (/^(f|女)$/i.test(x)) g = 'F';
      else if (/^a$/i.test(x)) gr = 'A'; else if (/^b$/i.test(x)) gr = 'B'; else if (/^c$/i.test(x)) gr = 'C';
      else if (/^(混|混雙|mix|mixed|y|yes)$/i.test(x)) mx = true;
    });
    // 名單入面（或者呢次滙入同一批入面）已經有同名會員 → 略過呢一項，唔會新增重複或者覆蓋原有資料
    if (state.members.some(m => m.name === name)) { skipped++; return; }
    if (addMember(name, g, gr, mx)) n++;
  });
  ui.bulkOpen = false; save(); render(); showAlert(skipped ? t('bulkAddedSkippedAlert', n, skipped) : t('bulkAddedAlert', n));
}
function renameMember(id, v) { const m = M(id); v = (v || '').trim(); if (m && v) { m.name = v; save(); } render(); }

/* ---------- 紀錄 ---------- */
function flipLog(id) {
  const l = state.log.find(x => x.id === id); if (!l) return;
  const oldW = l.teams[l.winner], oldL = l.teams[1 - l.winner];
  oldW.forEach(pid => { const m = M(pid); if (m) { m.wins = Math.max(0, m.wins - 1); m.losses++; } });
  oldL.forEach(pid => { const m = M(pid); if (m) { m.losses = Math.max(0, m.losses - 1); m.wins++; } });

    attendees: ids.map(id => { const m = M(id) || { name: '?', gender: '', grade: '', mixed: false }; const r = wl[id] || { w: 0, l: 0 };
      return { name: m.name, guest: !!m.guest, gender: m.gender, grade: m.grade, mixed: !!m.mixed, games: s.played[id] || 0, wins: r.w, losses: r.l, left: s.left.includes(id) }; }),

function download(name, text, mime) {
  // 喺 Claude Artifact 入面，普通嘅 <a download> 連結／Blob 下載未必有反應（要用 downloads
  // capability 先真正彈出儲存），所以呢度會兩種都試：有 downloadsApi 就用嗰個，
  // 同時都做返舊有嘅 Blob 連結方式做後備（真正瀏覽器入面呢個照樣有效）。
  if (downloadsApi) {
    downloadsApi.save({ filename: name, data: text }).catch(() => {});
  }
  try {
    const blob = new Blob(['﻿' + text], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) {}
}
/* 有部分內嵌瀏覽器（例如 Documents 開啟「封鎖 HTML 檢視器嘅外部連結」設定後）會擋咗
   Blob／下載連結，令匯出完全無反應。所以匯出時：嘗試自動下載之餘，同時彈出一個
   可以全選複製內文嘅視窗，確保無論邊種瀏覽器都攞到資料。 */
function offerExport(name, text, mime) {

function closeExport() { ui.exportDoc = null; render(); }
function copyExportText() {

  try { ta.focus(); ta.select(); ta.setSelectionRange(0, 999999); ok = document.execCommand('copy'); } catch (e) {}
  if (ok) { showAlert(t('copiedAlert')); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ta.value)
      .then(() => showAlert(t('copiedAlert')))
      .catch(() => showAlert(t('copyFailAlert')));
  } else showAlert(t('copyFailAlert'));
}
// 用系統原生「分享」面板（WhatsApp／Mail／訊息／AirDrop 等）直接傳送報告。
// 只有喺真正 Safari／支援 Web Share API 嘅瀏覽器先有效（部分內嵌瀏覽器例如 Documents 未必支援）。
function canShareFiles() {

}
function shareExportText() {

  const { name, text, mime } = doc;

    if (canShareFiles()) {
      const file = new File([text], name, { type: mime || 'text/plain' });
      if (navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: name }).catch(() => {}); return; }
    }
    if (navigator.share) { navigator.share({ title: name, text }).catch(() => {}); return; }

}

// 陞降建議：睇每位會員最近 N 場（state.log，按時間新到舊）嘅勝率，同設定的門檻比較。
function computeSuggestions() {
  const st = state.settings;
  const minGames = Math.max(1, +st.promoteMinGames || 20);
  const promoteTh = Math.max(0, Math.min(1, (+st.promoteWinRate || 65) / 100));
  const relegateTh = Math.max(0, Math.min(1, (+st.relegateWinRate || 35) / 100));
  const out = [];
  state.members.forEach(m => {
    if (m.gender !== 'M') return;
    const recent = state.log.filter(l => l.teams.flat().includes(m.id)).sort((a, b) => b.time - a.time).slice(0, minGames);
    if (recent.length < minGames) return;
    let wins = 0;
    recent.forEach(l => { const ti = l.teams.findIndex(tm => tm.includes(m.id)); if (ti === l.winner) wins++; });
    const rate = wins / recent.length;
    // A<->B 用原本設定嘅陞／降門檻；C<->B 對稱處理（B 太勁就陞上 A，B 太弱就降落 C；C 太勁就陞上 B）——
    // 呢個係喺三級制底下邏輯上必要嘅延伸，原本使用者要求只提到 A/B，未有明確講 C，屬於合理假設。
    let action = null;
    if (m.grade === 'B') {
      if (rate >= promoteTh) action = 'A';
      else if (rate <= relegateTh) action = 'C';
    } else if (m.grade === 'A' && rate <= relegateTh) action = 'B';
    else if (m.grade === 'C' && rate >= promoteTh) action = 'B';
    if (action) out.push({ member: m, rate, games: recent.length, action });
  });
  return out.sort((a, b) => b.rate - a.rate);
}

// 個人戰績走勢：以 Unicode 方塊字元做簡單走勢圖，避免引入圖表庫。
const SPARK_CHARS = ['▁', '▂', '▃', '▄', '▅', '▆', '▇', '█'];
function buildSparkline(matchesDesc, id) {
  if (!matchesDesc.length) return '';
  const asc = matchesDesc.slice().reverse();
  const bucketCount = Math.min(12, asc.length);
  const size = Math.ceil(asc.length / bucketCount);
  let out = '';
  for (let i = 0; i < asc.length; i += size) {
    const bucket = asc.slice(i, i + size);
    let w = 0;
    bucket.forEach(l => { const ti = l.teams.findIndex(tm => tm.includes(id)); if (ti === l.winner) w++; });
    const rate = bucket.length ? w / bucket.length : 0;
    out += SPARK_CHARS[Math.min(SPARK_CHARS.length - 1, Math.floor(rate * SPARK_CHARS.length))];
  }
  return out;
}
function trendCard() {

    const rateAll = winRateOf(matches), r10 = winRateOf(matches.slice(0, 10)), r30 = winRateOf(matches.slice(0, 30));

// 管理員模式：單一開關（ui.adminMode，唔會儲存落資料，每次重新載入都會重置返「未開啟」）。
// 未開啟時，導覽只可以留喺「活動」（球場編排）呢一頁；開啟需要輸入 state.settings.adminPassword，
// 一經輸入正確就解鎖晒所有分頁，直至再撳一下掣鎖返（鎖返唔使密碼）。
function toggleAdminMode() {
  if (ui.adminMode) { ui.adminMode = false; if (tab !== 'courts') { tab = 'courts'; ui.edit = {}; } render(); return; }
  showPrompt(t('adminModePwPrompt'), pw => {
    if (pw !== state.settings.adminPassword) { showAlert(t('wrongPwAlert')); return; }
    ui.adminMode = true; render();
  }, { inputType: 'password' });
}
// render() 之前如果中途擲出錯誤（例如某個特殊資料組合觸發到未覆蓋到嘅 bug），會令成個畫面
// 停留喺撳掣之前嘅舊樣——因為 app.innerHTML 嗰行冇行到就已經中斷，睇落好似「撳咗冇反應」，
// 但其實個動作（例如 Check-in）本身已經改咗資料，淨係重畫呢一步失敗；要撳第二粒掣（觸發第二次
// render()，如果冇再撞到嗰個錯誤）先會顯示返啱嘅畫面。而家用呢個安全包裝：一旦出錯，唔會再
// 靜靜哋咩都唔做，會將錯誤訊息直接顯示喺畫面度，等使用者可以影低／複製低傳畀開發者查。
function render() {
  try {
    renderUnsafe();
  } catch (e) {
    try { console.error('[HKSBC] render() failed:', e); } catch (e2) {}
    renderErrorFallback(e);
  }
}
function renderErrorFallback(e) {
  const app = document.getElementById('app');
  const msg = (e && (e.stack || e.message)) ? String(e.stack || e.message) : String(e);
  try {
    app.innerHTML = `<div style="padding:24px 18px;font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#7a2a22;background:#fff3f0;min-height:100vh;box-sizing:border-box">
      <h2 style="margin:0 0 10px;color:#a33;font-size:18px">⚠️ 畫面更新失敗</h2>
      <p style="line-height:1.6;margin:0 0 12px">呢一步操作可能已經完成（資料已改咗），但係畫面重畫嗰陣出咗錯，所以未即時顯示出嚟。<br>
      麻煩你影低或者複製低下面呢段文字傳畀開發者，等佢可以搵到問題所在；然後撳「重試」，或者重新載入呢頁。</p>
      <textarea readonly style="width:100%;height:180px;font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:8px;border:1px solid #d99;border-radius:8px;background:#fff;box-sizing:border-box" data-call="this.select()">${esc(msg)}</textarea>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
        <button data-call="render()" style="padding:10px 18px;border-radius:10px;border:none;background:#a33;color:#fff;font-weight:700;font-size:14px">重試</button>
      </div>
    </div>`;
  } catch (e2) { /* 連 fallback 都失敗：已經冇更多安全嘅做法，唯有留返舊畫面 */ }
}
function renderUnsafe() {
  const app = document.getElementById('app');
  if (booting) {
    app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:80vh;color:#888;font-size:15px">載入資料中… / Loading…</div>`;
    return;
  }
  if (!splashDone) { app.innerHTML = splashView(); return; }
  document.documentElement.lang = state.settings.lang === 'en' ? 'en' : 'zh-HK';
  if (!ui.adminMode && tab !== 'courts') { tab = 'courts'; ui.edit = {}; }
  // 管理員 MODE 開啟時，整個畫面底色轉做深淺藍色系，並喺頁首顯示明顯字樣，等使用者一望就知。
  try { document.body.classList.toggle('admin-on', !!ui.adminMode); } catch (e) {}
  const scroller = document.scrollingElement || document.documentElement;
  const scrollY = window.scrollY || scroller.scrollTop || 0;
  const views = { courts: viewCourts, attend: viewAttend, members: viewMembers, log: viewLog, settings: viewSettings };
  const allTabs = [['courts', t('tabCourts')], ['attend', t('tabAttend')], ['members', t('tabMembers')], ['log', t('tabLog')], ['settings', t('tabSettings')]];
  const tabs = ui.adminMode ? allTabs : allTabs.filter(([k]) => k === 'courts');
  app.innerHTML = `
    <div class="header">
      ${ui.adminMode ? `<div class="admin-banner">${esc(t('adminModeBanner'))}</div>` : ''}
      <div class="title-row"><div class="brand"><img src="${LOGO}" alt="HKSBC"><div class="brand-text"><span class="title">${esc(t('appTitle'))}</span><span class="brand-name">Hong Konger in Sutton Badminton Club</span></div></div>
        <span class="btn-row"><button class="badge-top" style="border:none;cursor:pointer" data-call="toggleAdminMode()" title="${esc(ui.adminMode ? t('adminModeOnBtn') : t('adminModeOffBtn'))}">${esc(ui.adminMode ? t('adminModeOnBtn') : t('adminModeOffBtn'))}</button><button class="badge-top" style="border:none;cursor:pointer" data-call="toggleLang()" title="${esc(t('langToggle'))}">${esc(t('langToggle'))}</button><span class="badge-top">${esc(t('tonightBadge', tonightCount()))}</span></span></div>
      <div class="tabs">${tabs.map(([k, n]) => `<button class="tab ${tab === k ? 'active' : ''}" data-call="setTab('${k}')">${esc(n)}</button>`).join('')}</div>
    </div>
    <div class="view">${views[tab]()}</div>
    <p class="note"><img class="foot-logo" src="${LOGO}" alt="HKSBC">${CLUB}<br>${t('offlineFooterNote')}</p>${swapModal()}${exportModal()}${dialogModal()}`;
  // 強制瀏覽器即刻完成一次同步 layout（讀取 offsetHeight 會逼瀏覽器行一次 reflow），
  // 懷疑係之前「撳咗掣但畫面唔郁」嘅真正成因：喺某啲內嵌／PWA 瀏覽器引擎入面，喺一個
  // click handler（甚至係佢入面嘅 setTimeout）內部連續、快速咁改 innerHTML＋郁 scrollTop，
  // compositor 有機會將呢兩個改動「夾埋一齊」處理、甚至延遲到下一個完全無關嘅事件先真正
  // 畫出嚟畫面（睇落就好似「撳咗冇反應」，其實 DOM／狀態已經改咗，淨係未畫出嚟）。而家
  // 讀一次 offsetHeight 逼佢即刻 reflow，再用 requestAnimationFrame 等瀏覽器真正畫完
  // 呢一幀之後，先至去郁 scrollTop，等個「畫面更新」同「捲動位置還原」清楚分開兩個步驟，
  // 唔會撞埋一齊處理。
  void app.offsetHeight;
  // 保持捲動位置：整個 #app 的 innerHTML 每次都會重新產生，瀏覽器（尤其 iPad Safari）
  // 有時會因而把畫面捲返上頂，造成每次按掣個畫面「上下彈」。重新產生內容後
  // 還原返之前嘅捲動位置，畫面先唔會郁。
  if (scrollY) {
    requestAnimationFrame(function () {
      window.scrollTo(0, scrollY); scroller.scrollTop = scrollY;
    });
  }
}
function setTab(nt) {
  if (nt !== 'courts' && !ui.adminMode) return;   // 未開啟管理員模式：只可以留喺「活動」頁
  tab = nt; ui.edit = {}; render();

render();
initPersistence();
// ---- 統一事件分派 ----
// 之前每粒掣都用返原生 onclick="funcName(...)" 屬性，各自負責喺自己最尾 call save()／render()；
// 出過幾次「撳咗但畫面冇反映」嘅報告，一路都懷疑同呢種「各自為政」嘅寫法有關（例如漏咗
// call render()、或者中途擲錯就冇行到嗰句 render()）。而家改用單一嘅集中式事件代理：
// 畫面產生嘅時候，掣上面唔再寫 onclick，而係寫 data-call="funcName(...)"（純粹屬性名唔同，
// 入面嘅內容完全冇變），交由呢度一個掛喺 document 嘅 click 監聽器統一處理，好處係：
// (a) 唔理個別動作本身有冇 call render()，呢度執行完之後都保證補做一次；
// (b) 動作本身如果中途擲錯，會即刻截住並顯示錯誤畫面，唔會再靜靜哋「冇反應」；
// (c) 所有互動都經過同一條路徑，行為一致、易於追查，唔再靠散落喺唔同函數入面嘅安全網。
document.addEventListener('click', function (e) {
  let el = e.target;
  while (el && el !== document && !(el.getAttribute && el.getAttribute('data-call'))) el = el.parentElement;
  if (!el || el === document) return;
  const expr = el.getAttribute('data-call');
  if (!expr) return;
  e.preventDefault();
  try {
    // 用返 call() 綁定 this＝搵到嗰粒掣／backdrop 本身，同傳返個原生 event 落去（等背景點擊
    // 關閉彈窗嗰種 `if(event.target===this)...` 寫法可以照舊運作，同原本 onclick 屬性嘅行為一致）。
    (new Function('event', expr)).call(el, e);
  } catch (err) {
    try { console.error('[HKSBC] action failed:', expr, err); } catch (e2) {}
    renderErrorFallback(err);
    return;
  }
  // 有彈窗開緊嗰陣（輸入密碼、confirm、alert），彈窗自己已經負責 render()＋focus 輸入欄，
  // 呢度如果照樣再 render() 多一次，會將啱啱 focus 咗嘅輸入欄整個換走，搞到個游標「跌咗出嚟」。
  if (ui.dialog) return;
  try { render(); } catch (err) {}
}, false);
// 全域錯誤攔截：之前 render() 本身已經有 try/catch 保護（畫面重畫失敗時會顯示錯誤畫面），
// 但好多動作（例如撳「呢隊勝出」入面嘅 dialogYes() → recordResult()、撳「完結此場」嘅
// closeCourt()）係喺 render() 之前、資料仲未完全處理完嗰陣就可能中途擲出錯誤——呢種錯誤
// 唔會行到 render() 入面嗰個 try/catch，會變成「完全冇反應」（用戶睇落好似撳咗等於冇撳），
// 但其實已經有一個未被截住嘅 JS 錯誤，淨係冇顯示出嚟。而家加返一個 window 層面嘅全域
// error／unhandledrejection 監聽，一旦有任何冇被截住嘅錯誤，即刻用返 renderErrorFallback()
// 將錯誤內容直接顯示喺畫面度，等使用者可以截圖俾開發者，唔會再見到「撳咗但乜都冇發生」。
try {
  window.addEventListener('error', function (e) {
    try {
      renderErrorFallback((e && e.error) || (e && e.message) || e);
    } catch (e2) {}
  });
  window.addEventListener('unhandledrejection', function (e) {
    try {
      renderErrorFallback((e && e.reason) || e);
    } catch (e2) {}
  });
} catch (e) {}
// 註冊離線快取（只有喺自行架設嘅網站，例如 GitHub Pages，先搵得到 service-worker.js；
// 喺 Claude Artifact 入面攞唔到就靜靜地失敗，唔影響網上版正常運作）。
try {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }
} catch (e) {}
</script>
